{% extends 'base.html' %}
{% block title %}Ro'yxatdan o'tish — LazzatHaus{% endblock %}

{% block extra_css %}
<style>
  .auth-wrap {
    max-width: 480px;
    margin: 3rem auto;
  }
  .auth-logo {
    text-align: center;
    margin-bottom: 2rem;
  }
  .auth-logo h2 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 900;
    color: var(--gold);
  }
  .auth-logo p { color: var(--muted); margin-top: 0.5rem; }

  .auth-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
  }

  .google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    width: 100%;
    padding: 0.85rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
    margin-bottom: 1.5rem;
  }
  .google-btn:hover { border-color: #4285f4; color: #4285f4; }

  .divider {
    display: flex; align-items: center; gap: 1rem;
    margin-bottom: 1.5rem;
    color: var(--muted); font-size: 0.85rem;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .form-group { margin-bottom: 1.1rem; }
  .form-group label {
    display: block;
    font-size: 0.82rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 0.4rem;
    font-weight: 500;
  }
  .form-group input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 0.8rem 1rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: var(--gold); }

  .hint { font-size: 0.78rem; color: var(--muted); margin-top: 0.3rem; }

  .submit-btn {
    width: 100%;
    background: var(--gold);
    color: #0a0a0a;
    border: none;
    border-radius: 12px;
    padding: 0.9rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 0.5rem;
  }
  .submit-btn:hover { background: var(--gold-light); transform: translateY(-1px); }
  .auth-footer {
    text-align: center;
    margin-top: 1.5rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .auth-footer a { color: var(--gold); text-decoration: none; font-weight: 500; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-logo">
    <h2>🍽 LazzatHaus</h2>
    <p>Yangi hisob yarating</p>
  </div>

  <div class="auth-card">
    <form method="post" action="{% url 'social:begin' 'google-oauth2' %}">
      {% csrf_token %}
      <button type="submit" class="google-btn">
        🌐 Google orqali ro'yxatdan o'tish
      </button>
    </form>

    <div class="divider">yoki ma'lumot kiriting</div>

    <form method="POST">
      {% csrf_token %}

      <div class="form-row">
        <div class="form-group">
          <label>👤 Ismingiz</label>
          <input type="text" name="first_name" placeholder="Sardor" required>
        </div>
        <div class="form-group">
          <label>🏷 Username</label>
          <input type="text" name="username" placeholder="sardor99" required>
        </div>
      </div>

      <div class="form-group">
        <label>📧 Email (ixtiyoriy)</label>
        <input type="email" name="email" placeholder="sizning@email.uz">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>🔒 Parol</label>
          <input type="password" name="password1" placeholder="••••••••" required>
          <div class="hint">Kamida 8 belgi</div>
        </div>
        <div class="form-group">
          <label>🔒 Parolni takrorla</label>
          <input type="password" name="password2" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="submit-btn">Ro'yxatdan o'tish →</button>
    </form>

    <div class="auth-footer">
      Hisobingiz bormi? <a href="{% url 'login' %}">Kirish</a>
    </div>
  </div>
</div>
{% endblock %}
